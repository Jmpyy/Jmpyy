<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Juan Pablo Figueroa: estudiante de Desarrollo de Software. C, sistemas embebidos y ciberseguridad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#24253a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b3f5c"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)" opacity="0.55"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#3b3f5c" stroke-width="1.5"/>

  <!-- barra de ventana -->
  <circle cx="44" cy="40" r="7" fill="#f7768e"/>
  <circle cx="68" cy="40" r="7" fill="#e0af68"/>
  <circle cx="92" cy="40" r="7" fill="#9ece6a"/>
  <text x="1156" y="45" text-anchor="end" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="15" fill="#565f89">kitty ~ fish</text>

  <!-- prompt -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
    <text x="60" y="118" font-size="22" fill="#9ece6a">juampy<tspan fill="#565f89">@</tspan><tspan fill="#7dcfff">ombu</tspan> <tspan fill="#bb9af7">~</tspan> <tspan fill="#c0caf5">$ whoami</tspan></text>

    <text x="60" y="190" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="68" font-weight="800" fill="url(#acc)">Juan Pablo Figueroa</text>

    <text x="62" y="236" font-size="24" fill="#c0caf5">Estudiante de Desarrollo de Software</text>
    <text x="62" y="272" font-size="20" fill="#8089b3">C <tspan fill="#3b3f5c">·</tspan> sistemas embebidos <tspan fill="#3b3f5c">·</tspan> ciberseguridad</text>

    <rect x="536" y="256" width="11" height="20" fill="#bb9af7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
